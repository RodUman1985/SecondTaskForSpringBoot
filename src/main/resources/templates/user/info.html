<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-card {
            max-width: 600px;
            margin: 0 auto;
        }
        .role-badge {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Your Profile</h1>
        <!-- Исправленная кнопка logout - теперь это форма с POST запросом -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary">Logout</button>
        </form>
    </div>

    <div class="card profile-card">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0" th:text="${user.name}"></h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <strong>Age:</strong> <span th:text="${user.age}"></span>
            </div>
            <div class="mb-3">
                <strong>Email:</strong> <span th:text="${user.email}"></span>
            </div>
            <div>
                <strong>Roles:</strong>
                <div th:each="role : ${user.roles}" class="d-inline">
                    <span class="badge bg-secondary role-badge"
                          th:text="${role.name.replace('ROLE_', '')}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id != null} ? 'Edit User' : 'Add User'">User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${user.id != null} ? 'Edit User' : 'Add User'">User Form</h1>

    <form th:action="@{${user.id != null} ? '/admin/users' : '/admin/users'}"
          th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="_method" th:if="${user.id != null}" value="put">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" th:field="*{age}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <div class="text-danger" th:if="${emailError != null}" th:text="${emailError}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{password}"
                   th:attr="required=${user.id == null} ? 'required' : null"
                   placeholder="Leave empty to keep current password">
            <small class="text-muted" th:if="${user.id != null}">Leave empty to keep current password</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Roles</label>
            <div th:each="role : ${allRoles}">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           th:id="${'role_' + role.id}"
                           th:value="${role.id}"
                           th:name="roleIds"
                           th:checked="${user.roles != null && user.roles.contains(role)}">
                    <label class="form-check-label" th:for="${'role_' + role.id}"
                           th:text="${role.name.replace('ROLE_', '')}"></label>
                </div>
            </div>
            <div class="text-danger" th:if="${roleError != null}" th:text="${roleError}"></div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${user.id != null} ? 'Update' : 'Create'">Save</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
